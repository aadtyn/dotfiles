# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands

after-startup-command = []

# Start AeroSpace at login
start-at-login = true

exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = true

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 7
    inner.vertical =   7
    outer.left =       0
    outer.bottom =     30
    outer.top =        0
    outer.right =      0

[mode.main.binding]

    cmd-alt-ctrl-h =         'focus left'
    cmd-alt-ctrl-j =         'focus down'
    cmd-alt-ctrl-k =         'focus up'
    cmd-alt-ctrl-l =         'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    cmd-alt-ctrl-shift-h = 'move left'
    cmd-alt-ctrl-shift-j = 'move down'
    cmd-alt-ctrl-shift-k = 'move up'
    cmd-alt-ctrl-shift-l = 'move right'

    cmd-alt-ctrl-1 = 'workspace 1'
    cmd-alt-ctrl-2 = 'workspace 2'
    cmd-alt-ctrl-3 = 'workspace 3'
    cmd-alt-ctrl-4 = 'workspace 4'
    cmd-alt-ctrl-5 = 'workspace 5'
    cmd-alt-ctrl-6 = 'workspace 6'
    cmd-alt-ctrl-7 = 'workspace 7'
    cmd-alt-ctrl-8 = 'workspace 8'
    cmd-alt-ctrl-9 = 'workspace 9'
    cmd-alt-ctrl-0 = 'workspace 10'
    cmd-alt-ctrl-leftSquareBracket = 'workspace prev'
    cmd-alt-ctrl-rightSquareBracket = 'workspace next'


    cmd-alt-ctrl-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget sketchybar --trigger space_windows_change']
    cmd-alt-ctrl-shift-0 = ['move-node-to-workspace 10', 'exec-and-forget sketchybar --trigger space_windows_change']

    cmd-alt-ctrl-shift-c = 'reload-config'
    cmd-alt-ctrl-r = 'mode resize'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    cmd-alt-ctrl-tab= 'move-node-to-monitor --wrap-around next'
    cmd-alt-ctrl-shift-tab= 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    cmd-alt-ctrl-n = 'split horizontal'
    cmd-alt-ctrl-m = 'split vertical'

    cmd-alt-ctrl-f = 'fullscreen'

    cmd-alt-ctrl-s = 'layout v_accordion' # 'layout stacking' in i3
    cmd-alt-ctrl-w = 'layout h_accordion' # 'layout tabbed' in i3
    cmd-alt-ctrl-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

    cmd-alt-ctrl-shift-space = 'layout floating tiling' # 'floating toggle' in i3


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'
